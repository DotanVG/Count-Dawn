<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Count Dawn</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(160deg, #0d0716 0%, #1a1226 55%, #3a215c 100%);
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
  }
  #welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    text-align: center;
    color: #e8ddff;
  }
  #cover {
    width: min(40vh, 280px);
    height: min(40vh, 280px);
    image-rendering: pixelated;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(196, 30, 47, 0.35);
    margin-bottom: 1.2em;
  }
  #welcome p {
    font-size: 1.1rem;
    margin: 0 0 1.5em;
    opacity: 0.85;
  }
  #playBtn {
    font-size: 1.4rem;
    font-weight: bold;
    padding: 0.75em 2em;
    border: none;
    border-radius: 999px;
    background: #c41e2f;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 6px 0 #7a1220, 0 8px 12px rgba(0,0,0,0.4);
    transition: transform 0.1s ease;
  }
  #playBtn:hover { transform: translateY(-2px); }
  #playBtn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #7a1220, 0 4px 8px rgba(0,0,0,0.4);
  }
  #gameFrame {
    display: none;
    width: 100%;
    height: 100%;
    border: none;
  }
  #errorMsg {
    margin-top: 1em;
    color: #ff8a8a;
    font-size: 0.9rem;
    display: none;
  }
</style>
</head>
<body>
  <div id="welcome">
    <img id="cover" src="COUNT_DAWN.jpeg" alt="Count Dawn" />
    <p>Hunt the hunters. Fill your veins. Beat the sunrise.</p>
    <button id="playBtn">Click to PLAY</button>
    <div id="errorMsg">Fullscreen unavailable — launching in windowed mode.</div>
  </div>
  <iframe id="gameFrame" allow="fullscreen; autoplay" allowfullscreen></iframe>

  <script>
    var LIVE_URL = 'https://count-dawn.vercel.app/?embed=1';

    document.getElementById('playBtn').addEventListener('click', function () {
      var launch = function () {
        var welcome = document.getElementById('welcome');
        var frame = document.getElementById('gameFrame');
        frame.src = LIVE_URL;
        welcome.style.display = 'none';
        frame.style.display = 'block';
      };

      var el = document.documentElement;
      var requestFs = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;

      if (requestFs) {
        Promise.resolve(requestFs.call(el)).then(launch).catch(function () {
          document.getElementById('errorMsg').style.display = 'block';
          launch();
        });
      } else {
        document.getElementById('errorMsg').style.display = 'block';
        launch();
      }
    });
  </script>
</body>
</html>
