<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Count Dawn — a reverse horde survival game: a vampire hunts waves of human hunters, collects blood, defeats their leader, and races back to his coffin before sunrise."
    />
    <title>Count Dawn</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0d0716;
        font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
      }
      @media (pointer: fine) {
        html,
        body,
        body * {
          cursor: none !important;
        }
        /* The audio editor is real HTML with sliders to drag, so it asks for
           the system pointer back rather than aiming with fangs. */
        html.show-system-cursor,
        html.show-system-cursor body,
        html.show-system-cursor body * {
          cursor: auto !important;
        }
      }
      #game-root {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0d0716;
      }
      #game-root canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      /*
       * A single full-game palette transform for reduced red perception.
       * Keeping it on the root means blood, particles, sprites, UI and future
       * art all receive the same treatment without per-asset maintenance.
       */
      #game-root.red-blind-palette {
        filter: hue-rotate(145deg) saturate(1.2) contrast(1.06);
      }
      #vampire-cursor {
        --jaw-width: 30px;
        position: fixed;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        z-index: 10000;
        opacity: 0;
        pointer-events: none;
        will-change: transform;
        transition: opacity 80ms linear;
      }
      #vampire-cursor.is-visible {
        opacity: 1;
      }
      /* Beats .is-visible: the fangs stay down until the game hands over
         control, and while the audio editor wants the real pointer. */
      #vampire-cursor.is-suppressed {
        opacity: 0;
      }
      .vampire-cursor__jaw {
        position: absolute;
        left: calc(var(--jaw-width) / -2);
        width: var(--jaw-width);
        height: auto;
        max-width: none;
        user-select: none;
        will-change: transform;
        filter: drop-shadow(0 2px 2px rgba(8, 2, 15, 0.75));
      }
      .vampire-cursor__jaw--upper {
        bottom: 3px;
        transform-origin: 50% 100%;
      }
      .vampire-cursor__jaw--lower {
        top: 3px;
        transform-origin: 50% 0%;
      }
      #vampire-cursor.is-biting .vampire-cursor__jaw--upper {
        animation: vampire-bite-upper 350ms ease-in-out infinite;
      }
      #vampire-cursor.is-biting .vampire-cursor__jaw--lower {
        animation: vampire-bite-lower 350ms ease-in-out infinite;
      }
      @keyframes vampire-bite-upper {
        0%, 100% { transform: translateY(0); }
        40%, 62% { transform: translateY(5px); }
      }
      @keyframes vampire-bite-lower {
        0%, 100% { transform: translateY(0); }
        40%, 62% { transform: translateY(-5px); }
      }
      @media (pointer: coarse) {
        #vampire-cursor {
          display: none;
        }
      }
      #boot-loader {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #c9a7ff;
        font-size: 1.5rem;
        letter-spacing: 0.1em;
        pointer-events: none;
        z-index: 10;
      }
      #fullscreen-btn {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 16px);
        right: calc(env(safe-area-inset-right, 0px) + 16px);
        width: 48px;
        height: 48px;
        border: 0;
        border-radius: 50%;
        background: rgba(13, 7, 22, 0.5);
        cursor: pointer;
        z-index: 9000;
        transition: transform 160ms ease, background 160ms ease;
      }
      #fullscreen-btn:hover {
        background: rgba(58, 33, 92, 0.65);
        transform: scale(1.06);
      }
      #fullscreen-btn .fs-corner {
        position: absolute;
        width: 12px;
        height: 12px;
        border-color: #c9a7ff;
        border-style: solid;
      }
      #fullscreen-btn .tl { top: 12px; left: 12px; border-width: 3px 0 0 3px; }
      #fullscreen-btn .tr { top: 12px; right: 12px; border-width: 3px 3px 0 0; }
      #fullscreen-btn .bl { bottom: 12px; left: 12px; border-width: 0 0 3px 3px; }
      #fullscreen-btn .br { bottom: 12px; right: 12px; border-width: 0 3px 3px 0; }

      /* Rotate-to-landscape overlay: a real DOM layer sized to the whole
         viewport, so it is large and crisp even though the Phaser canvas is
         letterboxed in portrait. Shown purely by CSS on touch + portrait; the
         orientation gate handles pausing gameplay/audio behind it. */
      #rotate-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9500;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6vh;
        background: #0d0716;
        color: #c9a7ff;
        text-align: center;
        padding: 8vw;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate-overlay { display: flex; }
      }
      #rotate-overlay .phone {
        width: 34vw;
        max-width: 220px;
        aspect-ratio: 10 / 19;
        border: 0.9vw solid #c9a7ff;
        border-radius: 5vw;
        background: rgba(201, 167, 255, 0.08);
        position: relative;
        animation: cd-rotate 2.6s ease-in-out infinite;
      }
      #rotate-overlay .phone::before {
        content: '';
        position: absolute;
        top: 6%;
        left: 50%;
        transform: translateX(-50%);
        width: 24%;
        height: 2.4%;
        border-radius: 2vw;
        background: #c9a7ff;
        opacity: 0.85;
      }
      #rotate-overlay .arrow-svg {
        width: 20vw;
        max-width: 96px;
        height: auto;
        color: #e0364a;
        transform-origin: center;
      }
      #rotate-overlay h2 {
        font-size: 7vw;
        margin: 0;
        font-weight: bold;
      }
      #rotate-overlay p {
        font-size: 4vw;
        margin: 0;
        color: #e8ddff;
        opacity: 0.8;
      }
      @keyframes cd-rotate {
        0%, 30% { transform: rotate(0deg); }
        55%, 80% { transform: rotate(-90deg); }
        100% { transform: rotate(0deg); }
      }
    </style>
  </head>
  <body>
    <div id="game-root">
      <div id="boot-loader">Waking the Count…</div>
    </div>
    <button id="fullscreen-btn" type="button" aria-label="Enter fullscreen" title="Enter fullscreen" hidden>
      <span class="fs-corner tl" aria-hidden="true"></span>
      <span class="fs-corner tr" aria-hidden="true"></span>
      <span class="fs-corner bl" aria-hidden="true"></span>
      <span class="fs-corner br" aria-hidden="true"></span>
    </button>
    <div id="rotate-overlay" aria-hidden="true">
      <!--
        Curved rotate arrow: the stroke progressively draws from the right
        end to the left (stroke-dashoffset 100->0), then un-draws back
        (0->100), on a loop — mirroring the original canvas-drawn version.
        The arrowhead rides the SAME path via animateMotion with matching
        keyTimes, so it always sits exactly on the curve, tangent to it
        (rotate="auto"), and always leads the reveal — no separate/guessed
        coordinates that can drift out of alignment with the curve.
      -->
      <svg class="arrow-svg" viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true">
        <path
          id="cd-arrow-path"
          d="M 82 41 A 40 40 0 0 0 22 41"
          fill="none"
          pathLength="100"
          stroke="currentColor"
          stroke-width="7"
          stroke-linecap="round"
          stroke-dasharray="100"
          stroke-dashoffset="100"
        >
          <animate attributeName="stroke-dashoffset" values="100;0;100" keyTimes="0;0.5;1" dur="1.8s" repeatCount="indefinite" />
        </path>
        <polygon points="-14,-10 14,0 -14,10" fill="currentColor">
          <animateMotion dur="1.8s" repeatCount="indefinite" rotate="auto" keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="linear">
            <mpath href="#cd-arrow-path" xlink:href="#cd-arrow-path"></mpath>
          </animateMotion>
        </polygon>
      </svg>
      <div class="phone"></div>
      <h2>Rotate your device</h2>
      <p>Count Dawn plays best in landscape 🦇</p>
    </div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
