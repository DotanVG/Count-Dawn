<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Count Dawn — a reverse horde survival game: a vampire hunts waves of human hunters, collects blood, defeats their leader, and races back to his coffin before sunrise."
    />
    <title>Count Dawn</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0d0716;
        font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
      }
      #game-root {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0d0716;
      }
      #game-root canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #boot-loader {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #c9a7ff;
        font-size: 1.5rem;
        letter-spacing: 0.1em;
        pointer-events: none;
        z-index: 10;
      }
      #fullscreen-btn {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 16px);
        right: calc(env(safe-area-inset-right, 0px) + 16px);
        width: 48px;
        height: 48px;
        border: 0;
        border-radius: 50%;
        background: rgba(13, 7, 22, 0.5);
        cursor: pointer;
        z-index: 9000;
        transition: transform 160ms ease, background 160ms ease;
      }
      #fullscreen-btn:hover {
        background: rgba(58, 33, 92, 0.65);
        transform: scale(1.06);
      }
      #fullscreen-btn .fs-corner {
        position: absolute;
        width: 12px;
        height: 12px;
        border-color: #c9a7ff;
        border-style: solid;
      }
      #fullscreen-btn .tl { top: 12px; left: 12px; border-width: 3px 0 0 3px; }
      #fullscreen-btn .tr { top: 12px; right: 12px; border-width: 3px 3px 0 0; }
      #fullscreen-btn .bl { bottom: 12px; left: 12px; border-width: 0 0 3px 3px; }
      #fullscreen-btn .br { bottom: 12px; right: 12px; border-width: 0 3px 3px 0; }

      /* Rotate-to-landscape overlay: a real DOM layer sized to the whole
         viewport, so it is large and crisp even though the Phaser canvas is
         letterboxed in portrait. Shown purely by CSS on touch + portrait; the
         orientation gate handles pausing gameplay/audio behind it. */
      #rotate-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9500;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6vh;
        background: #0d0716;
        color: #c9a7ff;
        text-align: center;
        padding: 8vw;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate-overlay { display: flex; }
      }
      #rotate-overlay .phone {
        width: 34vw;
        max-width: 220px;
        aspect-ratio: 10 / 19;
        border: 0.9vw solid #c9a7ff;
        border-radius: 5vw;
        background: rgba(201, 167, 255, 0.08);
        position: relative;
        animation: cd-rotate 2.6s ease-in-out infinite;
      }
      #rotate-overlay .phone::before {
        content: '';
        position: absolute;
        top: 6%;
        left: 50%;
        transform: translateX(-50%);
        width: 24%;
        height: 2.4%;
        border-radius: 2vw;
        background: #c9a7ff;
        opacity: 0.85;
      }
      #rotate-overlay .arrow-svg {
        width: 20vw;
        max-width: 96px;
        height: auto;
        color: #e0364a;
        animation: cd-pulse 1.6s ease-in-out infinite;
        transform-origin: center;
      }
      #rotate-overlay h2 {
        font-size: 7vw;
        margin: 0;
        font-weight: bold;
      }
      #rotate-overlay p {
        font-size: 4vw;
        margin: 0;
        color: #e8ddff;
        opacity: 0.8;
      }
      @keyframes cd-rotate {
        0%, 30% { transform: rotate(0deg); }
        55%, 80% { transform: rotate(-90deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes cd-pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.1); }
      }
    </style>
  </head>
  <body>
    <div id="game-root">
      <div id="boot-loader">Waking the Count…</div>
    </div>
    <button id="fullscreen-btn" type="button" aria-label="Enter fullscreen" title="Enter fullscreen" hidden>
      <span class="fs-corner tl" aria-hidden="true"></span>
      <span class="fs-corner tr" aria-hidden="true"></span>
      <span class="fs-corner bl" aria-hidden="true"></span>
      <span class="fs-corner br" aria-hidden="true"></span>
    </button>
    <div id="rotate-overlay" aria-hidden="true">
      <svg class="arrow-svg" viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M 78 27 A 38 38 0 0 0 24 27" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" />
        <path d="M 12 34 L 30 20 L 28 40 Z" fill="currentColor" />
      </svg>
      <div class="phone"></div>
      <h2>Rotate your device</h2>
      <p>Count Dawn plays best in landscape 🦇</p>
    </div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
